# MiniCPM-o 4.5 three-stage deploy, bs=8 duplex experiment profile.
# Not a default serving config: raises duplex concurrency from 4 to 8 on one
# large-memory GPU for service-level saturation benchmarking
# (benchmarks/minicpmo/benchmark_duplex_service_saturation.py
# --session-counts 8 --deploy-config <this file>).
pipeline: minicpmo_4_5
async_chunk: true
session_mode: duplex
# Matches Stage 0/1 max_num_seqs below.
active_stream_window: 8
duplex_session:
  max_sessions: 8

trust_remote_code: true
enable_prefix_caching: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 3
      enable_hift_graph: true
      enable_cfm_graph: true
      cfm_max_graphs: 32

stages:
  - stage_id: 0
    max_num_seqs: 8
    # B8 duplex thinker KV + per-session audio-encoder KV need more headroom
    # than the bs=4 profile (0.55). Iterate against measured peaks.
    gpu_memory_utilization: 0.62
    enforce_eager: false
    tensor_parallel_size: 1
    max_num_batched_tokens: 16384
    devices: "0"
    interleave_mm_strings: true
    media_io_kwargs:
      video:
        fps: 1
        num_frames: 128
    limit_mm_per_prompt:
      image: 64
      audio: 64
      video: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.0

  - stage_id: 1
    max_num_seqs: 8
    gpu_memory_utilization: 0.15
    enforce_eager: false
    max_num_batched_tokens: 8192
    # Talker context is 4096 (tts_config.max_position_embeddings).
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_2: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.8
      top_p: 0.85
      top_k: 25
      repetition_penalty: 1.05
      min_tokens: 50
      max_tokens: 4096
      seed: 42
      detokenize: false

  - stage_id: 2
    max_num_seqs: 8
    gpu_memory_utilization: 0.18
    enforce_eager: true
    enable_chunked_prefill: false
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      detokenize: true

platforms:
  cuda:
    stages:
      - stage_id: 1
        # Full-attention occupancy is bounded by max_num_seqs * max_model_len
        # (8 * 4096 = 32768 tokens). Keep the reported CUDA KV token capacity
        # above that bound because physical-preemption replay is unsupported.
        # The explicit cap leaves device headroom for concurrent Stage 2.
        kv_cache_memory_bytes: 4294967296  # 4 GiB

  npu:
    stages:
      - stage_id: 0
        max_num_batched_tokens: 8192
        compilation_config:
          cudagraph_mode: PIECEWISE
      - stage_id: 1
        max_num_batched_tokens: 8192
        compilation_config:
          cudagraph_mode: PIECEWISE
      - stage_id: 2
        additional_config:
          code2wav_enable_npu_graph: true
          code2wav_max_npu_graphs: 32
