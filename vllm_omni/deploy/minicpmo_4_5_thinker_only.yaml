# MiniCPM-o 4.5 thinker-only deploy: multimodal understanding -> text.
#
# Single-stage configuration that drops the talker/code2wav stages, so the
# thinker runs alone on the production vLLM path (piecewise torch.compile
# prefill + full CUDA-graph decode + paged KV). Companion to
# benchmarks/minicpmo/benchmark_thinker_engine.py and the thinker-only
# pattern used by ming_flash_omni / qwen2_5_omni / audex.
#
# Stage 0 knobs match minicpmo_4_5_bs8.yaml stage 0 where they affect the
# thinker execution path; the memory budget is raised to the full GPU since
# no talker or code2wav shares the device, and max_num_seqs is raised to 16
# to expose batched-decode scaling beyond the bs=8 duplex target.
pipeline: minicpmo_4_5_thinker_only
async_chunk: false

trust_remote_code: true
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 16
    gpu_memory_utilization: 0.85
    enforce_eager: false
    tensor_parallel_size: 1
    max_num_batched_tokens: 32768
    devices: "0"
    interleave_mm_strings: true
    media_io_kwargs:
      video:
        fps: 1
        num_frames: 128
    limit_mm_per_prompt:
      image: 64
      audio: 64
      video: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.0
