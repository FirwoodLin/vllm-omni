# Six Thinker GPUs. Each remaining GPU hosts one Talker and one Code2Wav
# replica, preserving downstream co-location with a smaller downstream pool.
base_config: base_h200_b32_fullgraph256.yaml

active_stream_window: 64
duplex_session:
  max_sessions: 64

stages:
  - stage_id: 0
    devices: "0,1,2,3,4,5"
    num_replicas: 6
    max_num_seqs: 16
    gpu_memory_utilization: 0.9

  - stage_id: 1
    devices: "6,7"
    num_replicas: 2
    max_num_seqs: 16
    gpu_memory_utilization: 0.20

  - stage_id: 2
    devices: "6,7"
    num_replicas: 2
    max_num_seqs: 16
    gpu_memory_utilization: 0.25
