# Async-scheduler A/B variant of thinker6_downstream_colocated.
#
# Keep the six Thinker replicas, two Talker replicas, two Code2Wav replicas,
# placement, and memory settings identical to the baseline.  The only
# experiment variable is Stage 1's AR scheduler.
base_config: base_h200_b32_fullgraph256.yaml

active_stream_window: 64
duplex_session:
  max_sessions: 64

stages:
  - stage_id: 0
    devices: "0,1,2,3,4,5"
    num_replicas: 6
    max_num_seqs: 16
    gpu_memory_utilization: 0.9

  - stage_id: 1
    devices: "6,7"
    num_replicas: 2
    max_num_seqs: 16
    gpu_memory_utilization: 0.20
    async_scheduling: true

  - stage_id: 2
    devices: "6,7"
    num_replicas: 2
    max_num_seqs: 16
    gpu_memory_utilization: 0.25
