# Four dedicated Thinker GPUs. Each remaining GPU hosts one Talker and one
# Code2Wav replica to use the headroom observed in the separated baseline.
base_config: base_h200_b32_fullgraph256.yaml

active_stream_window: 64
duplex_session:
  max_sessions: 64

stages:
  - stage_id: 0
    devices: "0,1,2,3"
    num_replicas: 4
    max_num_seqs: 16
    gpu_memory_utilization: 0.9

  - stage_id: 1
    devices: "4,5,6,7"
    num_replicas: 4
    max_num_seqs: 16
    gpu_memory_utilization: 0.20

  - stage_id: 2
    devices: "4,5,6,7"
    num_replicas: 4
    max_num_seqs: 16
    gpu_memory_utilization: 0.25

