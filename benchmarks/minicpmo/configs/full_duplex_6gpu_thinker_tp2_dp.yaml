# MiniCPM-o 4.5 native full-duplex benchmark topology.
# Thinker uses TP2 on GPUs 0-1; Talker and Code2Wav each use two one-GPU
# data-parallel replicas on GPUs 2-3 and 4-5 respectively.
base_config: ../../../vllm_omni/deploy/minicpmo_4_5_3gpu.yaml

pipeline: minicpmo_4_5
session_mode: duplex

stages:
  - stage_id: 0
    devices: "0,1"
    tensor_parallel_size: 2

  - stage_id: 1
    devices: "2,3"
    num_replicas: 2

  - stage_id: 2
    devices: "4,5"
    num_replicas: 2
