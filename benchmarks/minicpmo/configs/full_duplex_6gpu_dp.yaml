# MiniCPM-o 4.5 native full-duplex benchmark topology.
# Two one-GPU data-parallel replicas for every stage on six GPUs.
base_config: ../../../vllm_omni/deploy/minicpmo_4_5_3gpu.yaml

pipeline: minicpmo_4_5
session_mode: duplex

stages:
  - stage_id: 0
    devices: "0,1"
    num_replicas: 2

  - stage_id: 1
    devices: "2,3"
    num_replicas: 2

  - stage_id: 2
    devices: "4,5"
    num_replicas: 2
